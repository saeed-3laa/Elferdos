name: Foundation checks
on:
  push:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:deployment-gates
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Start isolated local Supabase for authorization and order tests
        run: npm run db:start:core > /dev/null 2>&1
      - run: npm run db:env
      - name: Build against the isolated local backend
        run: npm run build
      - name: Test direct authorization, orders, files, staff and MFA
        run: npm run test:e2e:local
        env:
          E2E_PRODUCTION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
