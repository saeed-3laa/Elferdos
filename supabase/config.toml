project_id = "al-ferdous-wholesale"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://127.0.0.1:3000/auth/confirm", "http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3200/auth/confirm", "http://127.0.0.1:3200/auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "تأكيد بريد إدارة الفردوس"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "تأكيد تغيير بريد إدارة الفردوس"
content_path = "./supabase/templates/email-change.html"

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_signup = true
enable_confirmations = false

# LOCAL DEVELOPMENT ONLY: the CLI disables phone/password auth unless a provider
# block is enabled. These deliberately invalid placeholders are NOT credentials.
# With confirmations disabled, password signup/login sends no SMS. OTP/SMS flows
# are unsupported and must never report success. Never deploy this block remotely.
[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "local-development-no-sms-provider"

[storage]
enabled = true
file_size_limit = "5MiB"
